name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: dsmvc-windows-x64
            cmake-architecture: -A x64
            enable-cuda: true
            cuda-subpackages: '["nvcc", "nvvm", "cuobjdump", "cudart", "crt"]'
          - os: ubuntu-24.04
            artifact: dsmvc-linux-x64
            cmake-architecture: ""
            enable-cuda: true
            cuda-subpackages: '["nvcc", "cuobjdump", "cudart", "crt"]'

    steps:
      - name: Check out dsmvc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out VapourSynth R57 SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vapoursynth/vapoursynth
          ref: 325756ed04588b31840fdb74479537cddcba4bf7
          path: dependencies/vapoursynth
          sparse-checkout: include
          persist-credentials: false

      - name: Install CUDA Toolkit
        if: matrix.enable-cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: 13.2.0
          method: network
          sub-packages: ${{ matrix.cuda-subpackages }}
          log-file-suffix: ${{ matrix.os }}

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          ${{ matrix.cmake-architecture }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DDSMVC_ENABLE_CUDA=${{ matrix.enable-cuda }}
          -DDSMVC_ENABLE_METAL=OFF
          -DDSMVC_VAPOURSYNTH_SDK="${{ github.workspace }}/dependencies/vapoursynth"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage plugin package
        run: cmake --install build --config Release --prefix package

      - name: Upload plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
          retention-days: 14

  macos-arm64-metal:
    name: dsmvc-macos-arm64-metal
    runs-on: macos-15
    env:
      DSMVC_DEPLOYMENT_TARGET: "13.3"
      DSMVC_VS_SDK_REF: 325756ed04588b31840fdb74479537cddcba4bf7

    steps:
      - name: Check out dsmvc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out VapourSynth R57 SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vapoursynth/vapoursynth
          ref: ${{ env.DSMVC_VS_SDK_REF }}
          path: dependencies/vapoursynth
          sparse-checkout: include
          persist-credentials: false

      - name: Provision native VapourSynth test runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install vapoursynth numpy
          vs_python_formula="$(
            HOMEBREW_NO_ENV_HINTS=1 brew deps --direct --formula vapoursynth |
              awk '/^python@[0-9]+\.[0-9]+$/ { print; exit }'
          )"
          test -n "$vs_python_formula"
          vs_python_version="${vs_python_formula#python@}"
          vs_python="$(brew --prefix "$vs_python_formula")/bin/python$vs_python_version"
          test -x "$vs_python"
          "$vs_python" - <<'PY'
          import platform
          import numpy
          import vapoursynth as vs

          assert platform.machine() == "arm64", platform.machine()
          assert vs.__api_version__.api_major == 4, vs.__api_version__
          print(
              f"VapourSynth={vs.__version__} API={vs.__api_version__} "
              f"NumPy={numpy.__version__} machine={platform.machine()}"
          )
          PY
          echo "DSMVC_VS_PYTHON=$vs_python" >> "$GITHUB_ENV"

      - name: Preflight Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx metal --version
          xcrun --sdk macosx metallib --version
          xcrun --find metal-nm

      - name: Configure arm64 Metal Release
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DSMVC_DEPLOYMENT_TARGET" \
            -DBUILD_TESTING=ON \
            -DDSMVC_BUILD_BENCHMARKS=OFF \
            -DDSMVC_ENABLE_CUDA=OFF \
            -DDSMVC_ENABLE_METAL=ON \
            -DDSMVC_VAPOURSYNTH_SDK="$GITHUB_WORKSPACE/dependencies/vapoursynth" \
            -DDSMVC_VS_PYTHON="$DSMVC_VS_PYTHON"

      - name: Build arm64 Metal Release
        run: cmake --build build --parallel

      - name: Assert ARM test inventory
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --show-only=json-v1 > build/ctest-inventory.json
          "$DSMVC_VS_PYTHON" - build/ctest-inventory.json <<'PY'
          import json
          import sys

          inventory = json.load(open(sys.argv[1], encoding="utf-8"))
          actual = {test["name"] for test in inventory["tests"]}
          required = {
              "dsmvc_engine_tests",
              "dsmvc_hybrid_batch_coordinator_tests",
              "dsmvc_metal_artifact_inventory",
              "dsmvc_metal_scheduler_tests",
              "dsmvc_metal_yuv_staging_tests",
              "dsmvc_vs_metal_integration",
          }
          missing = sorted(required - actual)
          if missing:
              raise SystemExit(f"required ARM tests are missing: {missing}")
          print(f"required ARM tests registered: {sorted(required)}")
          PY

      - name: Test arm64 Metal Release
        run: ctest --test-dir build --output-on-failure --parallel 6

      - name: Stage arm64 Metal package
        run: cmake --install build --prefix package

      - name: Smoke installed API4 Metal plugin
        shell: bash
        run: |
          set -euo pipefail
          "$DSMVC_VS_PYTHON" tests/vs_metal_integration.py \
            --plugin package/vapoursynth/dsmvc.so \
            --expect-metal enabled

      - name: Validate and describe arm64 Metal package
        shell: bash
        run: |
          set -euo pipefail
          "$DSMVC_VS_PYTHON" cmake/macos_release_manifest.py \
            --repo "$GITHUB_WORKSPACE" \
            --build-dir "$GITHUB_WORKSPACE/build" \
            --package-dir "$GITHUB_WORKSPACE/package" \
            --entrypoints "$GITHUB_WORKSPACE/cmake/metal_entrypoints.txt" \
            --source-revision "$GITHUB_SHA" \
            --vapoursynth-sdk-ref "$DSMVC_VS_SDK_REF" \
            --vapoursynth-python "$DSMVC_VS_PYTHON" \
            --deployment-target "$DSMVC_DEPLOYMENT_TARGET" \
            --json-out "$GITHUB_WORKSPACE/package/share/dsmvc/BUILD-MANIFEST.json" \
            --checksums-out "$GITHUB_WORKSPACE/package/SHA256SUMS"
          (cd package && shasum -a 256 -c SHA256SUMS)

      - name: Upload arm64 Metal package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsmvc-macos-arm64-metal-macos13.3
          path: package/
          if-no-files-found: error
          retention-days: 14
