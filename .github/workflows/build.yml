name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: dsmvc-windows-x64
            cmake-architecture: -A x64
            enable-cuda: true
            cuda-subpackages: '["nvcc", "nvvm", "cuobjdump", "cudart", "crt"]'

    steps:
      - name: Check out dsmvc
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out VapourSynth R57 SDK
        uses: actions/checkout@v4
        with:
          repository: vapoursynth/vapoursynth
          ref: 325756ed04588b31840fdb74479537cddcba4bf7
          path: dependencies/vapoursynth
          sparse-checkout: include
          persist-credentials: false

      - name: Install CUDA Toolkit
        if: matrix.enable-cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: 13.2.0
          method: network
          sub-packages: ${{ matrix.cuda-subpackages }}
          log-file-suffix: ${{ matrix.os }}

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          ${{ matrix.cmake-architecture }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DDSMVC_ENABLE_CUDA=${{ matrix.enable-cuda }}
          -DDSMVC_VAPOURSYNTH_SDK="${{ github.workspace }}/dependencies/vapoursynth"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage plugin package
        run: cmake --install build --config Release --prefix package

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
          retention-days: 14
